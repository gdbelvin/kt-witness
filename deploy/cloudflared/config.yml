# Cloudflare Tunnel for the witness.
#
# Locally-managed on purpose. A token-based tunnel keeps its routing in the
# Cloudflare dashboard, which means the answer to "what is this thing serving,
# and to whom" lives somewhere that is not the repository. For a service whose
# entire value is that its behaviour can be checked, the ingress rules belong
# next to the code.
#
# ── Why a tunnel rather than an A record ─────────────────────────────────────
#
# The site has a residential address that moves. An A record pointing at it goes
# stale without warning, and a witness that has silently become unreachable
# looks — to anyone consuming its cosignatures — exactly like a witness that has
# stopped working. A tunnel dials outward and keeps working across an address
# change, with no inbound ports and no home IP in public DNS.
#
# The cost is that Cloudflare sits in the delivery path. Worth stating plainly:
# they can serve stale content or refuse to serve it, and they cannot forge a
# cosignature. The signatures are the product; this is only delivery. But
# availability is a real property for a witness, so a delivery failure is a
# genuine failure, not a cosmetic one.
#
# ── Only the subdomain is delegated ──────────────────────────────────────────
#
# `kt.gdbsecurity.com` is a Cloudflare zone; `gdbsecurity.com` stays on
# Squarespace DNS. Cloudflare subdomain zones work on the Free plan and
# Squarespace supports NS records, so nothing about the website or email moves
# to make this work — the delegated subtree is exactly the namespace the witness
# already lives in.
#
# ── Placeholders ─────────────────────────────────────────────────────────────
#
# 794b8736-e0aa-44ec-9db9-759ace6fa64d is printed by `cloudflared tunnel create kt-witness`. The
# credentials file it writes is a secret: it authenticates this tunnel to
# Cloudflare. Keep it out of the repository — .gitignore already covers *.json
# under this directory.

tunnel: 794b8736-e0aa-44ec-9db9-759ace6fa64d
# Mounted at creds/ rather than directly in /etc/cloudflared, because a
# directory mounted over that path would shadow this very file.
credentials-file: /etc/cloudflared/creds/794b8736-e0aa-44ec-9db9-759ace6fa64d.json

# Keep the connection warm across the dynamic address changes this exists for.
protocol: quic
retries: 5
grace-period: 30s

ingress:
  # One label, not two.
  #
  # This was witness.kt.gdbsecurity.com, and Cloudflare's free Universal SSL
  # covers gdbsecurity.com and *.gdbsecurity.com — a single label. It has no
  # certificate for a two-label name and aborts the TLS handshake before DNS,
  # the tunnel or the origin matter at all. HTTP worked throughout, which made
  # the failure look like a tunnel problem rather than a certificate one.
  #
  # The alternatives were a separate kt.gdbsecurity.com zone, where the name
  # would be first-level again, or Advanced Certificate Manager. Renaming was
  # free and simpler — but only because nothing had been published yet.
  - hostname: witness.gdbsecurity.com
    service: http://127.0.0.1:8088
    originRequest:
      # The monitoring endpoint is fetched by other witnesses and by C2SP
      # tooling, unauthenticated, exactly as the plain-text contract expects.
      # Nothing here should buffer or rewrite it.
      connectTimeout: 10s
      noTLSVerify: false
      httpHostHeader: witness.gdbsecurity.com

  # Anything else reaching this tunnel is not ours to answer.
  - service: http_status:404
