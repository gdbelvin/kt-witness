// The contract between a witness and the machines that verify for it.
//
// This file is the specification. Prose in a README is a poor protocol
// definition for anything a third party might implement, and the point of this
// channel is that other people's machines can join it.
//
// # What a worker is trusted with, which is almost nothing
//
// A worker reports that an epoch verified. It cannot be believed on that alone:
// the operator's signed root is public, so a worker that did no work can still
// report the correct answer. Everything below is shaped by that.
//
//   - Assignments carry a nonce that must be echoed, so a result answers one
//     dispatch and an older honest result cannot be replayed as new work.
//   - Results outside the assigned range are refused.
//   - An expired lease returns its range to the queue with a FRESH nonce, so an
//     abandoned worker's late reply cannot answer the reissue.
//   - Nothing a worker says produces a misbehaviour finding. A disagreement
//     means the witness re-runs the epoch itself, and its own answer decides.
//
// A hostile worker can waste dispatch and inflate a coverage figure until it is
// spot-checked. It cannot make this witness accuse an operator.

syntax = "proto3";

package ktwitness.work.v1;

option go_package = "github.com/gdbsecurity/kt-witness/internal/workpb;workpb";

// Work is one long-lived bidirectional session per worker.
//
// Bidirectional rather than lease-and-submit because the witness should be able
// to push a range the moment one becomes available, and because a worker that
// disappears should be detectable by the stream closing rather than by a lease
// quietly ageing out.
service Work {
  rpc Session(stream WorkerMessage) returns (stream WitnessMessage);
}

message WorkerMessage {
  oneof msg {
    Hello hello = 1;
    Result result = 2;
    Progress progress = 3;
    Capacity capacity = 4;
    Want want = 5;
  }
}

message WitnessMessage {
  oneof msg {
    Assignment assignment = 1;
    Ack ack = 2;
  }
}

// Hello opens the session. It must be the first message.
message Hello {
  string name = 1;
  // Origins this worker has a verifier for. A worker handed work it cannot do
  // reports every epoch unavailable, which from the witness's side is
  // indistinguishable from the log being down — so it is asked rather than
  // assumed.
  repeated string origins = 2;
  // How many epochs it will work on at once. The opening Want, in effect: the
  // witness sizes the first assignment from it, and everything after that comes
  // from Want messages as capacity frees up.
  int32 parallel = 3;
  // Free-text, for the operator's own benefit when something looks wrong.
  string version = 4;
  string platform = 5;

  // The protocol this worker speaks. A session whose protocol differs from the
  // witness's is refused, loudly, rather than served.
  //
  // This exists because a stale worker is not a worker that fails: protobuf
  // fields are positional, so an old build's `root` arrives in the field now
  // called `computed_prev_root` and the witness records the resulting mismatch
  // as a fact about the LOG. Two workers running a build one commit old wrote
  // roughly 3,300 false "unverified" epochs that way, which is a false hole in
  // the coverage — the one number this witness must not get wrong in that
  // direction. Refusing the session costs a restart; accepting it corrupts the
  // record silently.
  int32 protocol = 6;
}

// Want asks for more work, and is what makes this channel pull rather than push.
//
// The witness used to decide when to send: it leased a range, pushed it, and
// then blocked until that range came back in full before leasing another. So
// every worker held exactly one range at a time, whatever it was — a forty-core
// box and a laptop got the same thing — and the pipeline drained completely at
// every boundary while the last epoch finished and an ack round-tripped.
// Measured on a laptop: twenty-three seconds between ranges of twelve epochs it
// could work eight at a time.
//
// The worker knows its own capacity and always did; it reports it in Hello and
// in Capacity, and for a long time the witness only logged it. Now it asks.
//
// Epochs is how many MORE this worker can take on top of what it already holds.
// It is a request, not a reservation: the witness may send fewer, or nothing,
// and the worker asks again when it has room. Asking for more than can be
// finished inside a lease is self-defeating rather than dangerous — the surplus
// expires and is handed to somebody else.
message Want {
  int32 epochs = 1;
}

// Assignment is a contiguous range of epochs on one log.
message Assignment {
  // Where to fetch the proof, when the witness wants to choose.
  //
  // Normally empty: a worker builds the URL from the operator's log directory
  // and fetches from the operator, which is the arrangement that makes its
  // verdict worth having — it checks the proof against roots it resolved
  // itself, from the source, not against anything this witness asserted.
  //
  // When the witness serves proofs, this is set on EVERY assignment, and the
  // worker fetches {base}/proof/{origin}/{epoch}. One proof in a hundred that
  // it serves has a bit flipped, and the worker must reject those — which only
  // tests anything because it cannot tell which ones they are.
  //
  // An earlier version set this only for the corrupted ones, which labelled
  // them: a worker had merely to refuse anything coming from the witness to
  // score perfectly while verifying nothing. A test the subject can identify
  // is not a test.
  //
  // The roots are still resolved by the worker from the operator, never taken
  // from here. Serving the bytes lets the witness test a worker; it does not
  // let it make one agree.
  string proof_base = 7;

  // Fields 8 and 9 were `step` and `block`: a range was split into two
  // interleaved assignments, evens and odds, and one worker was never leased
  // both halves at once.
  //
  // The reasoning was sound and the mechanism did not deliver it. A worker
  // holding epoch E and E+1 can answer for E without doing the append-only
  // check — the published roots chain, so curr_E equals prev_{E+1} equals
  // Root(unchanged_{E+1}), computable from the neighbour's proof with the
  // commitment never applied and the merged tree never built. But the queue
  // only refused the two halves SIMULTANEOUSLY, and a worker was routinely
  // handed the second half minutes after finishing the first: gpu-box took
  // #7.0 at 13:52:56 and #7.1 at 13:54:51. Nothing stops it keeping the proofs.
  //
  // So the adjacency was never actually withheld, and the machinery cost real
  // complexity — the completion arithmetic that counted (to-from)/step+1 stalled
  // a laptop for twenty minutes at a time when it was got wrong.
  //
  // What withholds it instead is the canary, aimed at the part of the proof the
  // shortcut does not read. A worker taking it never touches `inserted`, so a
  // bit flipped there produces two correct roots from a corrupted proof — which
  // is exactly the alarm. See internal/workrpc/proofs.go.
  reserved 8, 9;
  reserved "step", "block";

  string id = 1;
  string origin = 2;
  int64 from = 3;
  int64 to = 4;
  // Echoed in every result for this assignment.
  string nonce = 5;
  // Unix seconds. Past it the lease is void: results will be refused and the
  // range may already belong to somebody else, so a worker should stop rather
  // than finish.
  int64 deadline_unix = 6;
}

message Result {
  string assignment_id = 1;
  string nonce = 2;
  string origin = 3;
  int64 epoch = 4;

  // The two roots the worker COMPUTED from the proof, and nothing else.
  //
  // It is never told what the operator published, and it does not report a
  // verdict. That is not a division of labour, it is what makes the answer
  // worth having: a worker that does not know the expected value cannot report
  // it without doing the work, so fabrication stops being something to sample
  // for and becomes something that cannot happen.
  //
  // The witness holds the published roots and does the comparison. A worker
  // that computes wrong roots produces a mismatch, which the witness resolves
  // by re-verifying the epoch itself — it can waste our time, and it cannot
  // make us believe anything.
  string computed_prev_root = 6;
  string computed_curr_root = 7;

  string worker = 8;
  int64 duration_ms = 9;
  // Set when the epoch could not be verified. Not a finding: an epoch that
  // could not be fetched is unavailable, not evidence of anything.
  string error = 10;
}

// Progress lets a long assignment say it is still alive, so a slow worker is
// distinguishable from a dead one before its lease expires.
message Progress {
  string assignment_id = 1;
  int64 epoch = 2;
}

// Capacity is what a worker can currently do, sent periodically and unprompted.
//
// The witness cannot infer this. It sees results arriving and cannot tell a
// laptop that has been closed from one whose owner is compiling something, or a
// machine that is yielding correctly from one that is broken — and those want
// opposite responses. A worker that says "I am down to one at a time because my
// owner came back" is reporting a healthy system doing what it was built to do.
//
// Capacity is for the operator to look at; Want is what actually schedules.
// They are deliberately separate: this one is a description of the machine and
// is sent on a timer whether or not there is work, so a fleet that has gone
// quiet is still legible. Conflating them would mean an idle worker stopped
// reporting at exactly the moment its state became interesting.
message Capacity {
  // How many epochs this worker will run at once, right now. Its own
  // measurement of itself, not a configured maximum.
  int32 parallel = 1;
  // Cores the worker believes are in use across its whole machine, and the
  // ceiling it is holding itself to. Both in cores, both as the worker
  // measures them — two machines will not agree on what a core is, and that is
  // fine: the interesting shape is each machine against its own budget.
  double load_cores = 2;
  double budget_cores = 3;
  // Logical CPUs the worker may use. On a Mac in background QoS this is the
  // efficiency-core count, not the machine's core count, and the difference is
  // the whole point of running there.
  int32 cpus = 4;
}

message Ack {
  string assignment_id = 1;
  int64 epoch = 2;
  bool accepted = 3;
  // Why not, when it was refused. Sent so a misbehaving or misconfigured worker
  // can be diagnosed from its own logs rather than only from the witness's.
  string reason = 4;
}
