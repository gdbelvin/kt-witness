services:
  kt-witness:
    build:
      context: .
      platforms: [linux/amd64]
    image: kt-witness:latest
    restart: unless-stopped

    # The witness's identity and its record of what it has attested. Back this
    # up: losing witness.key means coming back as a different party, and anyone
    # who listed the old key in their trust policy stops seeing us.
    volumes:
      - ./data:/data
      # Construction audits performed on other hardware, mounted READ-ONLY from
      # a directory the operator owns rather than into the container's own data
      # volume. The witness must never be able to write to the file that raises
      # its coverage — and the operator must be able to, without sudo.
      - ./import:/import:ro
      # The config is mounted read-only from the repository rather than copied
      # into ./data. An earlier setup step copied it, and the copy silently
      # drifted: the repository grew from 10 logs to 77 while the container went
      # on reading the stale copy, cosigning ten logs and reporting no errors
      # because it never knew about the rest. Nothing about that looks wrong
      # from the outside, which is what made it dangerous.
      - ./deploy/witness.json:/config/witness.json:ro

    # The work channel's shared token, from a file the operator owns rather
    # than the compose file. A missing token closes the channel rather than
    # opening it, so an unset variable here fails safe.
    env_file:
      - ./secrets/work.env

    # No environment block: PROTON_TREE_WORKERS went with the local Proton
    # replay.
    #
    # It governed how much of this machine a tree rebuild could take, and the
    # answer was sixteen of thirty-two cores for roughly two hours of every
    # four-hour epoch. The rebuild now runs beside a GPU that does it in sixty
    # seconds and this witness imports the verdict, so the whole question — and
    # the tuning that went with it — no longer arises here. The AKD sweep gets
    # the machine, which is the consumer that cannot be accelerated: Meta and
    # WhatsApp publish proofs, not trees, and there is nothing to rebuild.

    # Read the mounted config, not the copy under /data.
    # -backfill walks each log's published history and records the verified
    # range. It runs in the background, so it never delays witnessing, and it
    # repeats every 6h so the recorded range keeps up with the tip. Without it
    # the history-coverage metric counts against a range frozen in the past.
    command: ["-config", "/config/witness.json", "-backfill"]

    # Tier B streams a ~284 MB proof per verified epoch. tmpfs keeps that churn
    # off disk; 1g leaves room for one proof plus slack.
    tmpfs:
      - /tmp:size=1g

    # One ports list, because two keys in the same mapping is not a merge — YAML
    # rejects the duplicate, and a parser that tolerates it silently keeps one
    # and drops the other. Whichever lost, the symptom would have been a service
    # that looked fine and was missing a listener.
    #
    # The host port is configurable because 8080 is heavily contested — on the
    # first host this was deployed to, hashtopolis already held it. The
    # container port stays 8080; only the outside changes.
    #
    # The work channel is bound to ONE LAN address rather than published
    # broadly, and is deliberately not routed through the tunnel: nothing
    # outside this network has any business submitting verification results.
    ports:
      - "${KT_WITNESS_PORT:-8080}:8080"
      - "192.168.0.10:8090:8090"

    # One AKD verification peaks around 3.7 GB RSS. The limit is above that with
    # headroom, and deliberately not far above: exceeding it should kill the
    # container loudly rather than drive the host into swap.
    # Three sidecar workers, each peaking near 3.7 GB on a Meta proof, so the
    # working set is ~11 GB. The limit is above that with headroom and
    # deliberately not far above: exceeding it should kill the container loudly
    # rather than drive the host into swap. Raise this and sidecar_workers
    # together — one without the other is either wasted memory or an OOM kill.
    # 44g of the VM's 64g. The sidecar pool is sized from this limit
    # (see audit.DefaultWorkers), so raising it buys workers: 44 * 0.75 / 4 = 8.
    #
    # The remaining 20g is not slack. Proton's replay memory-maps a 13.6 GB tree
    # and reads it end to end, so page cache is the difference between a step
    # that streams and one that thrashes; it is working memory that simply
    # belongs to the kernel rather than to us.
    #
    # Safe to set ahead of the VM resize: DefaultWorkers takes the smaller of
    # this limit and what the machine physically has, so on the old 31g box it
    # still computes four workers rather than eight and an OOM kill.
    mem_limit: 44g

    # The monitoring endpoint is the product. If it stops serving, the witness is
    # cosigning into the void and should be restarted.
    healthcheck:
      test: ["CMD", "/usr/local/bin/kt-witness", "-config", "/config/witness.json", "-healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]

    # The witness listens on the host, and the tunnel dials it over the host's
    # loopback rather than the Docker network: the ingress rule names
    # 127.0.0.1:8088, and that has to mean the same interface the witness is
    # published on.
    network_mode: host

    # Run as the host user that owns the credentials.
    #
    # The image is distroless and runs as its own non-root user, which cannot
    # read a 0600 file owned by somebody else — cloudflared reports that as
    # "credentials file doesn't exist", which sends you looking for a missing
    # file that is right there. The alternative was loosening the secret to
    # 0644 inside a world-traversable directory, which is the wrong direction
    # for the one file that authenticates this tunnel.
    user: "1000:1000"

    volumes:
      - ./deploy/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Credentials go in a SUBdirectory. Mounting the secrets directory
      # directly onto /etc/cloudflared would shadow the config file mounted
      # above it — two mounts claiming the same path, where the one that wins
      # depends on Docker's ordering rather than on anything stated here.
      #
      # The credentials authenticate this tunnel to Cloudflare. Read-only, and
      # .gitignore covers /secrets/ — keep it that way.
      - ./secrets/cloudflared:/etc/cloudflared/creds:ro

    depends_on:
      - kt-witness

    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
