[package]
name = "kt-akd-verify"
version = "0.1.0"
edition = "2021"

[dependencies]
akd = { version = "0.13.0", features = ["public_auditing", "whatsapp_v1"] }
protobuf = "3.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tokio pinned: the local registry index lacks tokio-macros 2.7.x needed by 1.53.x.
tokio = { version = "=1.47.1", features = ["rt", "rt-multi-thread"] }
ureq = "3.4"

[profile.release]
opt-level = 3
