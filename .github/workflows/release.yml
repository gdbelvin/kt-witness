# Build and release, on GitHub. Deploy stays on the home lab.
#
# This workflow owns the artifact: it tests the tree, builds the image the
# Dockerfile describes, pushes it to GHCR, and attests where it came from. It
# never touches the machine the witness runs on. The .env, the work-channel
# token, the tunnel credentials and the signing key live only there, are read
# only at runtime, and are not inputs to any of this — so GitHub has no reason
# to hold them and does not.
#
# Deploying is the operator's call, by hand, per deploy/RUNBOOK.md "Releasing":
# pin a tag this workflow published in the server's .env and `compose pull`.
# Nothing here restarts a witness; uptime is the product, and the moment to
# interrupt it is a judgement no pipeline should make.
#
# What gets tagged:
#
#   push to master      ghcr.io/<repo>:sha-<7 hex>   and   :master
#   push of a v* tag    ghcr.io/<repo>:<version>     and   :latest, plus a
#                       GitHub Release with generated notes
#   pull request        tests only; nothing is built or pushed
#
# The commit is baked into the binary as build args, which the Dockerfile
# prefers over the .build-info file the tarball path writes. `kt-witness
# -version` and the first line of `/` then name exactly what is running.
name: release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    # Only pushes publish. A pull request from a fork would not have the
    # permissions anyway, and one from a branch should not be able to put an
    # image under the repository's name before review.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=master,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - id: stamp
        run: |
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The witness host is amd64. Adding arm64 here is one line, but it
          # doubles the build for a machine that does not exist yet.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.stamp.outputs.commit }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit's own provenance would wrap the image in an index that
          # some tooling misreads as multi-platform. The signed attestation
          # below says the same thing in a form `gh attestation verify` reads.
          provenance: false

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.IMAGE }}
          VERSION: ${{ needs.image.outputs.version }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          cat > notes.md <<EOF
          Image: \`$IMAGE:$VERSION\`
          Digest: \`$DIGEST\`

          Verify the image was built by this workflow from this tag:

              gh attestation verify oci://$IMAGE@$DIGEST --repo $GITHUB_REPOSITORY

          Deploy: set \`KT_WITNESS_TAG=$VERSION\` in the server's .env, then
          \`docker compose pull kt-witness && docker compose up -d kt-witness\`.
          See deploy/RUNBOOK.md, "Releasing".

          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes --notes-file notes.md
